<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="128" height="128">
	<title>Property Visibility</title>
	<defs>
		<clipPath id="tile-shape">
			<rect width="512" height="512" rx="112"/>
		</clipPath>
		<clipPath id="site-a-area">
			<polygon points="0,0 324,0 188,512 0,512"/>
		</clipPath>
	</defs>
	<!-- Tile, split diagonally into two sites: site A (raspberry) and site B (plum) -->
	<g clip-path="url(#tile-shape)">
		<rect width="512" height="512" fill="#D81B60"/>
		<polygon points="324,0 512,0 512,512 188,512" fill="#3A1240"/>
	</g>
	<!-- Fields shown on both sites -->
	<rect x="92" y="128" width="328" height="64" rx="32" fill="#FFFFFF"/>
	<rect x="92" y="320" width="328" height="64" rx="32" fill="#FFFFFF"/>
	<!-- Field hidden on site B: it stops at the split -->
	<rect x="92" y="224" width="328" height="64" rx="32" fill="#FFFFFF" clip-path="url(#site-a-area)"/>
</svg>
