name: CI

# Every step calls a script in build/ci, so a local run executes the same commands (CONTRIBUTING.md, "Run CI locally").
# Both jobs run once per Umbraco major: the same source builds package 1.x for Umbraco 17 and 2.x for Umbraco 18
# (UMBRACO_MAJOR, src/Directory.Build.props). The acceptance job installs the nupkg the build job packed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its superseded run; a run on main is never cancelled once it has started.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # One version for the client manifest (umbraco-package.json), the assemblies and the nupkg of this run.
  PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}

jobs:
  build-test-pack:
    name: Build, test and pack (Umbraco ${{ matrix.umbraco-major }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        umbraco-major: [17, 18]
    env:
      UMBRACO_MAJOR: ${{ matrix.umbraco-major }}
    # The same value from every leg of the matrix: it depends on the changed files only.
    outputs:
      docs-only: ${{ steps.changes.outputs.docs-only }}
    steps:
      # Two commits deep: the merge commit of a pull request or the squash commit on main, and its first parent.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      # A change to only Markdown files or docs/ skips the acceptance job; a manual run always runs it.
      - name: Documentation-only change
        id: changes
        if: github.event_name != 'workflow_dispatch'
        run: bash build/ci/docs-only-change.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Umbraco.Community.PropertyVisibility/Client/package-lock.json

      # Client (npm ci, typecheck, build) and solution (Release, ContinuousIntegrationBuild because CI=true).
      - name: Build
        run: bash build/ci/build.sh

      - name: Unit tests
        run: bash build/ci/test.sh

      - name: JSON schema drift check
        run: bash build/ci/schema-check.sh

      # Pack into artifacts/nupkg, inspect the package (tools/inspect-nupkg.sh) and check its deterministic source paths.
      - name: Pack and inspect
        run: bash build/ci/pack.sh

      # Corrupted copies (entries outside the allowlist such as a source map or a secrets.json in the client output, a
      # missing LICENSE, THIRD-PARTY-NOTICES.md or Hey API banner, a wrong manifest version) must fail the inspection.
      - name: Leak test for the package inspection
        run: bash build/ci/test-inspect-nupkg.sh

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nupkg-umbraco-${{ matrix.umbraco-major }}
          path: artifacts/nupkg/*.nupkg
          if-no-files-found: error

      - name: Upload unit test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-umbraco-${{ matrix.umbraco-major }}
          path: TestResults
          if-no-files-found: ignore

  # The nupkg of build-test-pack, installed into a copy of the test site the way a site gets it: no ProjectReference, so
  # the package's buildTransitive props, JSON schemas and static web assets are what the suite tests. Skipped for a
  # documentation-only change (the required check is the gate job "Acceptance tests (Playwright)" below).
  acceptance:
    name: Acceptance tests (Playwright, Umbraco ${{ matrix.umbraco-major }})
    needs: build-test-pack
    if: needs.build-test-pack.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        umbraco-major: [17, 18]
    env:
      PV_PORT: 44300
      PV_TEST_SITE_DIR: artifacts/published-package-site
      UMBRACO_MAJOR: ${{ matrix.umbraco-major }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/Umbraco.Community.PropertyVisibility.AcceptanceTests/package-lock.json

      - name: Download the package
        uses: actions/download-artifact@v8
        with:
          name: nupkg-umbraco-${{ matrix.umbraco-major }}
          path: artifacts/nupkg

      # On the lowest Umbraco version the package supports, the one build-test-pack resolved.
      - name: Build a copy of the test site with the package
        env:
          PV_PACKAGE_SOURCE: artifacts/nupkg
        run: bash build/ci/published-package-site.sh

      # Clean SQLite database, unattended install and uSync import; waits for the backoffice to answer 200.
      - name: Start the test site
        run: bash build/ci/start-test-site.sh

      # The backoffice adds the manifest's version to the bundle URL (?umb__rnd=), which keeps browsers from caching the
      # previous release.
      - name: The served manifest carries the package version
        run: bash build/ci/check-served-manifest.sh "$PACKAGE_VERSION"

      - name: Playwright suite
        run: bash build/ci/acceptance.sh

      - name: Stop the test site
        if: always()
        run: bash build/ci/stop-test-site.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-umbraco-${{ matrix.umbraco-major }}
          path: tests/Umbraco.Community.PropertyVisibility.AcceptanceTests/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-umbraco-${{ matrix.umbraco-major }}
          path: tests/Umbraco.Community.PropertyVisibility.AcceptanceTests/test-results
          if-no-files-found: ignore

      - name: Upload test site logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-site-logs-umbraco-${{ matrix.umbraco-major }}
          path: |
            ${{ env.PV_TEST_SITE_DIR }}/umbraco/Logs
            artifacts/test-site/test-site.log
          if-no-files-found: ignore

  # The checks the main ruleset requires: one per stage, for both Umbraco majors. They always run, because a matrix job
  # that is skipped never reports its expanded names ("..., Umbraco 17"), so a required check on such a name would wait
  # forever on a documentation-only change.
  build-test-pack-result:
    name: Build, test and pack
    needs: build-test-pack
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Umbraco 17 and 18
        env:
          RESULT: ${{ needs.build-test-pack.result }}
        run: |
          echo "Build, test and pack for Umbraco 17 and 18: $RESULT"
          [ "$RESULT" = success ]

  acceptance-result:
    name: Acceptance tests (Playwright)
    needs: [build-test-pack, acceptance]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Umbraco 17 and 18
        env:
          RESULT: ${{ needs.acceptance.result }}
          DOCS_ONLY: ${{ needs.build-test-pack.outputs.docs-only }}
        run: |
          echo "Acceptance tests for Umbraco 17 and 18: $RESULT (documentation-only change: ${DOCS_ONLY:-false})"
          # Skipped is a pass only for a documentation-only change; it is also the result when the build failed.
          if [ "$RESULT" = skipped ] && [ "$DOCS_ONLY" = true ]; then exit 0; fi
          [ "$RESULT" = success ]
