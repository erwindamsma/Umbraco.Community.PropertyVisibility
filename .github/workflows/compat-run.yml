name: Compatibility run

# One compatibility run against one Umbraco major, called by compat.yml once per major (17 and 18): build, unit tests, a
# type check of the client against that version's backoffice typings and the whole Playwright suite against the latest
# stable version of the major (or a version given by hand). The build uses exactly that version
# (-p:UmbracoCmsVersion=[x.y.z]) and fails when any Umbraco.Cms package resolves another one. Next to it, the job
# published-package runs the same suite against a copy of the test site that installs the latest published package of
# the major's line (1.x for 17, 2.x for 18) from nuget.org, the way a site gets it (build/ci/published-package-site.sh).
# A failed run, or a scheduled run cancelled by its timeout, opens an issue "Compatibility: Umbraco <version>", or
# comments on the open one. Every run
# also compares the backoffice sources the client relies on (build/ci/backoffice-sources.txt) with the last verified
# version of the major and shows the result in its summary; a green run against a version that is not in
# Constants.TestedUmbracoVersions opens one issue "Verify Umbraco <version>" with that comparison, for the manual part
# of docs/compatibility.md "Recurring check".

on:
  workflow_call:
    inputs:
      umbraco-major:
        description: The Umbraco major to test, 17 or 18.
        required: true
        type: string
      umbraco-version:
        description: Exact Umbraco.Cms version of that major. Empty tests the latest stable version of the major.
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PACKAGE_VERSION: 0.0.0-compat.${{ github.run_number }}
  UMBRACO_MAJOR: ${{ inputs.umbraco-major }}

jobs:
  compat:
    name: Build and test against Umbraco ${{ inputs.umbraco-major }}.x
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      umbraco-version: ${{ steps.resolve.outputs.version }}
      tested: ${{ steps.compare.outputs.tested }}
    env:
      PV_PORT: 44300
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/Umbraco.Community.PropertyVisibility/Client/package-lock.json
            tests/Umbraco.Community.PropertyVisibility.AcceptanceTests/package-lock.json

      # After Setup Node: the script reads nuget.org's registration index with node (listed versions only). UMBRACO_MAJOR
      # selects the major when no version is given.
      - name: Resolve the Umbraco version
        id: resolve
        env:
          REQUESTED_VERSION: ${{ inputs.umbraco-version }}
        run: |
          version=$(bash build/ci/resolve-umbraco-version.sh "$REQUESTED_VERSION")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "UMBRACO_CMS_VERSION=$version" >> "$GITHUB_ENV"
          echo "### Umbraco.Cms $version" >> "$GITHUB_STEP_SUMMARY"

      # UMBRACO_CMS_VERSION (set above) makes build.sh restore exactly that version and print what every project resolved.
      - name: Build
        id: build
        run: bash build/ci/build.sh

      # build.sh builds the client from the lockfile (the floor's typings); this checks it against the tested version's.
      - name: Client typings against @umbraco-cms/backoffice of that version
        run: bash build/ci/client-typecheck.sh

      - name: Unit tests
        run: bash build/ci/test.sh

      - name: JSON schema drift check
        run: bash build/ci/schema-check.sh

      - name: Start the test site
        run: bash build/ci/start-test-site.sh

      - name: Playwright suite
        run: bash build/ci/acceptance.sh

      - name: Stop the test site
        if: always()
        run: bash build/ci/stop-test-site.sh

      # Also after a failed test: the comparison helps to find the cause. Needs the client's TypeScript from the build.
      - name: Compare the backoffice sources with the last verified version
        id: compare
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash build/ci/compare-backoffice-sources.sh

      - name: Upload the backoffice source comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compat-backoffice-sources-umbraco-${{ inputs.umbraco-major }}
          path: artifacts/backoffice-compare
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compat-playwright-report-umbraco-${{ inputs.umbraco-major }}
          path: tests/Umbraco.Community.PropertyVisibility.AcceptanceTests/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compat-playwright-test-results-umbraco-${{ inputs.umbraco-major }}
          path: tests/Umbraco.Community.PropertyVisibility.AcceptanceTests/test-results
          if-no-files-found: ignore

      - name: Upload test site logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compat-test-site-logs-umbraco-${{ inputs.umbraco-major }}
          path: |
            src/Umbraco.Community.PropertyVisibility.TestSite/umbraco/Logs
            artifacts/test-site/test-site.log
          if-no-files-found: ignore

  # The package as a site installs it: no ProjectReference, so the nupkg's buildTransitive props and static web assets are
  # what runs. Builds nothing of this repository but the copied test site.
  published-package:
    name: Published package on Umbraco ${{ inputs.umbraco-major }}.x
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      umbraco-version: ${{ steps.resolve.outputs.version }}
      package-version: ${{ steps.site.outputs.package-version }}
    env:
      PV_PORT: 44300
      PV_TEST_SITE_DIR: artifacts/published-package-site
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/Umbraco.Community.PropertyVisibility.AcceptanceTests/package-lock.json

      - name: Resolve the Umbraco version
        id: resolve
        env:
          REQUESTED_VERSION: ${{ inputs.umbraco-version }}
        run: |
          version=$(bash build/ci/resolve-umbraco-version.sh "$REQUESTED_VERSION")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "UMBRACO_CMS_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build a copy of the test site with the package from nuget.org
        id: site
        run: |
          bash build/ci/published-package-site.sh
          echo "### Umbraco.Cms $UMBRACO_CMS_VERSION with the published package" >> "$GITHUB_STEP_SUMMARY"

      - name: Start the test site
        run: bash build/ci/start-test-site.sh

      # The backoffice adds the manifest's version to the bundle URL (?umb__rnd=), which keeps browsers from caching the
      # previous release.
      - name: The served manifest carries the package version
        env:
          EXPECTED_VERSION: ${{ steps.site.outputs.package-version }}
        run: bash build/ci/check-served-manifest.sh "$EXPECTED_VERSION"

      - name: Playwright suite
        run: bash build/ci/acceptance.sh

      - name: Stop the test site
        if: always()
        run: bash build/ci/stop-test-site.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compat-published-package-playwright-report-umbraco-${{ inputs.umbraco-major }}
          path: tests/Umbraco.Community.PropertyVisibility.AcceptanceTests/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compat-published-package-playwright-test-results-umbraco-${{ inputs.umbraco-major }}
          path: tests/Umbraco.Community.PropertyVisibility.AcceptanceTests/test-results
          if-no-files-found: ignore

      - name: Upload test site logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compat-published-package-test-site-logs-umbraco-${{ inputs.umbraco-major }}
          path: |
            ${{ env.PV_TEST_SITE_DIR }}/umbraco/Logs
            artifacts/test-site/test-site.log
          if-no-files-found: ignore

  # The only jobs that may write issues. This one also runs when a scheduled run was cancelled (the job timeout cancels
  # a job).
  report-failure:
    name: Open or update the compatibility issue
    needs: [compat, published-package]
    if: ${{ always() && (contains(needs.*.result, 'failure') || (contains(needs.*.result, 'cancelled') && github.event_name == 'schedule')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 'Open or comment on the issue "Compatibility: Umbraco <version>"'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UMBRACO_VERSION: ${{ needs.compat.outputs.umbraco-version || needs.published-package.outputs.umbraco-version }}
          COMPAT_RESULT: ${{ needs.compat.result }}
          PUBLISHED_RESULT: ${{ needs.published-package.result }}
          PACKAGE_VERSION_TESTED: ${{ needs.published-package.outputs.package-version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Compatibility: Umbraco ${UMBRACO_VERSION:-$UMBRACO_MAJOR.x (version not resolved)}"
          body="The compatibility run against Umbraco.Cms ${UMBRACO_VERSION:-$UMBRACO_MAJOR.x (not resolved)}: the build from source ended with '$COMPAT_RESULT', the published package${PACKAGE_VERSION_TESTED:+ $PACKAGE_VERSION_TESTED} with '$PUBLISHED_RESULT'. $RUN_URL"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --limit 50 \
            | jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "Commented on issue #$number"
          else
            gh issue create --title "$title" --body "$body"
          fi

  # A green run against a version that is not verified yet. No checkout: it only reads the compat job's comparison.
  report-new-version:
    name: Open the verification issue
    needs: compat
    if: ${{ needs.compat.result == 'success' && needs.compat.outputs.tested == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Download the backoffice source comparison
        uses: actions/download-artifact@v8
        with:
          name: compat-backoffice-sources-umbraco-${{ inputs.umbraco-major }}
          path: backoffice-compare

      - name: 'Open the issue "Verify Umbraco <version>" unless it exists'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UMBRACO_VERSION: ${{ needs.compat.outputs.umbraco-version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Verify Umbraco $UMBRACO_VERSION"
          # Open or closed: a version gets one issue, not one per weekly run.
          number=$(gh issue list --state all --search "\"$title\" in:title" --json number,title --limit 50 \
            | jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')
          if [ -n "$number" ]; then
            echo "Issue #$number exists already"
            exit 0
          fi
          {
            echo "The compatibility run against Umbraco.Cms $UMBRACO_VERSION passed: $RUN_URL"
            echo
            echo "Left before $UMBRACO_VERSION is Verified (docs/compatibility.md, Recurring check):"
            echo
            echo "- [ ] Look into every change below in code the package relies on"
            echo "- [ ] Check the upstream issues listed in docs/compatibility.md, and whether the known upstream errors in the acceptance suite (KNOWN_UPSTREAM_ERRORS) are fixed"
            echo "- [ ] Add $UMBRACO_VERSION to the Umbraco $UMBRACO_MAJOR list of Constants.TestedUmbracoVersions, to docs/compatibility.md (a row and \"What was re-checked for $UMBRACO_VERSION\") and to the README's version table"
            echo
          } > body.md
          # An issue body holds 65536 characters; without the diffs the table always fits.
          if [ $(($(wc -c < body.md) + $(wc -c < backoffice-compare/report.md))) -le 65000 ]; then
            cat backoffice-compare/report.md >> body.md
          else
            cat backoffice-compare/summary.md >> body.md
            printf '\nThe diffs are too long for this issue: see the compat-backoffice-sources-umbraco-%s artifact of the run.\n' "$UMBRACO_MAJOR" >> body.md
          fi
          gh issue create --title "$title" --body-file body.md
