name: Compatibility

# Weekly build, unit tests, a type check of the client against that version's backoffice typings and the whole
# Playwright suite against the latest stable Umbraco 17.x and 18.x (or a version given by hand), to catch backoffice
# drift before users do. Each major runs compat-run.yml, which also opens the issues "Compatibility: Umbraco <version>"
# (a failed run) and "Verify Umbraco <version>" (a green run against a version that is not verified yet).
#
# GitHub disables a scheduled workflow after 60 days without activity in a public repository: re-enable it in the
# Actions tab after a quiet period (docs/compatibility.md, "Recurring check").

on:
  schedule:
    # Off the hour: GitHub delays or drops scheduled runs most often at the start of an hour.
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      umbraco-version:
        description: Exact Umbraco.Cms version, for example 17.7.0 or 18.2.1 (only its major runs). Empty tests the latest stable 17.x and 18.x on nuget.org.
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A requested version of another major would skip both runs below without a word.
  check-input:
    name: Check the requested version
    if: ${{ inputs.umbraco-version != '' && !startsWith(inputs.umbraco-version, '17.') && !startsWith(inputs.umbraco-version, '18.') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail on an unsupported major
        env:
          REQUESTED_VERSION: ${{ inputs.umbraco-version }}
        run: |
          echo "::error::$REQUESTED_VERSION is not an Umbraco 17.x or 18.x version"
          exit 1

  umbraco-17:
    name: Umbraco 17
    if: ${{ inputs.umbraco-version == '' || startsWith(inputs.umbraco-version, '17.') }}
    uses: ./.github/workflows/compat-run.yml
    with:
      umbraco-major: '17'
      umbraco-version: ${{ inputs.umbraco-version }}
    permissions:
      contents: read
      issues: write

  umbraco-18:
    name: Umbraco 18
    if: ${{ inputs.umbraco-version == '' || startsWith(inputs.umbraco-version, '18.') }}
    uses: ./.github/workflows/compat-run.yml
    with:
      umbraco-major: '18'
      umbraco-version: ${{ inputs.umbraco-version }}
    permissions:
      contents: read
      issues: write
